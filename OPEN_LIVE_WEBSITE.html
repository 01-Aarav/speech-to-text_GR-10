<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://speech-to-text-gr-10.streamlit.app/">
    <title>Opening Whisper Speech-to-Text Studio...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #38BDF8; }
        p { color: #94A3B8; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #0284C7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #0369A1; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎙️ Whisper Speech-to-Text Studio</h2>
        <p>Redirecting you to the live web application on Streamlit Cloud...</p>
        <p>If you are not redirected automatically, click below:</p>
        <a class="btn" href="https://speech-to-text-gr-10.streamlit.app/">Open Live Application</a>
    </div>
</body>
</html>
